
<div class="featured-research-section" id="featured-research">
	<div class="featured-research-content">
		<div class="featured-research-image">
			<img src="/DIEF.png" alt="Dialogic Intelligence Evaluation Framework diagram" />
		</div>
		<div class="featured-research-details">
			<div class="featured-research-label">FEATURED RESEARCH</div>
			<h2 class="featured-research-title">
				Dialogic Intelligence Evaluation Framework (DIEF)
			</h2>
			<p class="featured-research-description">
				A framework for evaluating reasoning quality in multi-agent AI debate systems using structured argumentative assessment and human discretion simulation.
			</p>
			<div class="featured-research-chips" aria-label="Featured research topics">
				<button
					type="button"
					class="chip featured-research-chip"
					[ngClass]="{ selected: selectedChip === 'debate' }"
					[attr.aria-pressed]="selectedChip === 'debate'"
					(click)="selectChip('debate')"
				>
					Multi-Agent Debate
				</button>
				<button
					type="button"
					class="chip featured-research-chip"
					[ngClass]="{ selected: selectedChip === 'deliberation' }"
					[attr.aria-pressed]="selectedChip === 'deliberation'"
					(click)="selectChip('deliberation')"
				>
					AI Deliberation
				</button>
				<button
					type="button"
					class="chip featured-research-chip"
					[ngClass]="{ selected: selectedChip === 'evaluation' }"
					[attr.aria-pressed]="selectedChip === 'evaluation'"
					(click)="selectChip('evaluation')"
				>
					Reasoning Evaluation
				</button>
				<button
					type="button"
					class="chip featured-research-chip"
					[ngClass]="{ selected: selectedChip === 'discretion' }"
					[attr.aria-pressed]="selectedChip === 'discretion'"
					(click)="selectChip('discretion')"
				>
					Human Discretion Simulation
				</button>
			</div>
			<div class="featured-research-actions">
				<a class="btn btn-primary" href="#" target="_blank">Read Paper</a>
				<a class="btn btn-secondary" href="#" target="_blank">View Abstract</a>
			</div>
		</div>
	</div>

	<a class="section-nav-link" href="#recent-writings">Next <span aria-hidden="true">↓</span></a>
</div>
